<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" aria-label="Hinomaru rising sun with Swift GTi silhouette">
  <defs>
    <radialGradient id="gtiSunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3344" stop-opacity="1"/>
      <stop offset="70%" stop-color="#E20A17" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#B0050E" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="gtiRay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E20A17" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E20A17" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 16 rays radiating from center (300,280) -->
  <g transform="translate(300 280)">
    <g fill="url(#gtiRay)">
      <!-- Rays drawn as long thin triangles, rotated -->
      <g><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(22.5)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(45)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(67.5)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(90)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(112.5)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(135)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(157.5)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(180)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(202.5)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(225)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(247.5)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(270)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(292.5)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(315)"><polygon points="-18,0 18,0 0,-340"/></g>
      <g transform="rotate(337.5)"><polygon points="-18,0 18,0 0,-340"/></g>
    </g>
    <!-- Sun disc -->
    <circle r="118" fill="url(#gtiSunCore)"/>
    <circle r="118" fill="none" stroke="#FFB347" stroke-width="1.4" opacity="0.5"/>
  </g>
  <!-- Swift GTi side silhouette overlaying the lower portion -->
  <g transform="translate(60 340) scale(0.89)" fill="none" stroke="#F5EFE0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 38 148 L 38 138 Q 42 122 62 118 L 110 110 Q 130 70 168 58 L 230 50 L 340 50 Q 372 52 392 70 L 414 96 L 470 104 Q 498 108 504 126 L 504 148"/>
    <path d="M 38 148 L 90 152 L 175 152 M 290 152 L 380 152 L 504 148" stroke-width="2.4"/>
    <path d="M 168 58 L 192 96 M 260 50 L 260 96 M 340 50 L 326 96"/>
    <path d="M 110 96 L 414 96" stroke-width="2.4"/>
    <path d="M 90 152 A 36 36 0 0 1 175 152"/>
    <path d="M 380 152 A 36 36 0 0 1 470 152"/>
    <circle cx="132" cy="160" r="26" stroke-width="3"/>
    <circle cx="132" cy="160" r="10" stroke-width="2" opacity="0.7"/>
    <circle cx="425" cy="160" r="26" stroke-width="3"/>
    <circle cx="425" cy="160" r="10" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
