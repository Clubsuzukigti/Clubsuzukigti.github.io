<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Suzuki Swift GTi side profile">
