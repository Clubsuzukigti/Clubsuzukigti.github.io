  <circle cx="58" cy="172" r="6" stroke-width="1.6" opacity="0.7"/>
  <circle cx="262" cy="172" r="6" stroke-width="1.6" opacity="0.7"/>
  <!-- License plate hint -->
  <rect x="138" y="180" width="44" height="10" rx="1" stroke-width="1.2" opacity="0.5"/>
