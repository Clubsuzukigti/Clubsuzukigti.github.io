  <rect x="52" y="100" width="62" height="22" rx="3" stroke-width="2.2"/>
  <rect x="58" y="106" width="50" height="10" rx="2" stroke-width="1.4" opacity="0.55"/>
  <rect x="206" y="100" width="62" height="22" rx="3" stroke-width="2.2"/>
  <rect x="212" y="106" width="50" height="10" rx="2" stroke-width="1.4" opacity="0.55"/>
  <!-- Grille -->
  <rect x="124" y="108" width="72" height="14" rx="1.5" stroke-width="2"/>
  <line x1="124" y1="115" x2="196" y2="115" stroke-width="1" opacity="0.6"/>
  <!-- Bumper -->
  <path d="M 40 130 L 30 160 L 30 178 Q 30 190 44 192 L 276 192 Q 290 190 290 178 L 290 160 L 280 130"/>
  <!-- Lower air intake -->
  <rect x="100" y="156" width="120" height="18" rx="2" stroke-width="1.8"/>
  <line x1="100" y1="165" x2="220" y2="165" stroke-width="0.9" opacity="0.55"/>
