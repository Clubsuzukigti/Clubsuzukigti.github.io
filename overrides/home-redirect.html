{#-
  home-redirect.html
  Redirige instantáneamente / y /en/ al bundle premium de Claude Design.
  Usado por docs/index.md y docs/index.en.md.
-#}
<!DOCTYPE html>
<html lang="{{ config.theme.language or 'es' }}">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.meta.description or config.site_description }}">
  <meta http-equiv="refresh" content="0; url={{ base_url }}/landing/">
  <link rel="canonical" href="{{ page.canonical_url | replace('index.html', 'landing/') }}">
  <style>
    html, body { margin:0; padding:0; background:#0A0908; color:#F5EFE0;
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
      display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; }
    .loader { font-size: 14px; opacity: 0.6; letter-spacing: 2px; text-transform: uppercase; }
    .loader::after { content: '·'; animation: dots 1.4s steps(4) infinite; margin-left: 4px; }
    @keyframes dots { 0%{content:'·'} 25%{content:'· ·'} 50%{content:'· · ·'} 75%{content:'· · · ·'} 100%{content:'·'} }
    a { color: #FFB347; text-decoration: none; border-bottom: 1px solid #FFB347; }
  </style>
  <script>window.location.replace('{{ base_url }}/landing/');</script>
</head>
<body>
  <div class="loader">Abriendo el garage</div>
  <noscript>
    <p>Si no eres redirigido automáticamente, <a href="{{ base_url }}/landing/">haz click aquí</a>.</p>
  </noscript>
</body>
</html>
